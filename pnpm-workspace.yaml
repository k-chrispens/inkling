packages:
  - "packages/*"
  - "deployments/*"

# Elanor's packages declare React as a peer and ship declarations that import its types;
# hoisting lets TypeScript resolve them from the packages' store directories.
publicHoistPattern:
  - "@types/react"
  - "@types/react-dom"

engineStrict: true
saveExact: true
strictPeerDependencies: true
# pnpm 10 skipped these build scripts without asking; keep them skipped.
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  msgpackr-extract: false
  workerd: false
